<!DOCTYPE html>

    <link rel="stylesheet" href="assets/Styles/Style.css">
    <link rel="stylesheet" href="assets/Styles/Responsive/productDetail.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">

                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="offcanvas offcanvas-end bg-dark text-white" tabindex="-1" id="offcanvasNavbar" aria-labelledby="offcanvasNavbarLabel">
                    <div class="offcanvas-header">

                    <div class="offcanvas-body">

                            <li class="nav-item">

                            </li>
                            <li class="nav-item">
                                <a href="./cart.html" class="nav-link text-white fw-bold">Carrito</a>
                            </li>
                            <li class="nav-item">

                </div>

    <footer class="container-fluid p-3 gradient">
        <div class="row">

            <div class="col-12 col-md-6 mb-3 mb-md-0">

                    <div class="container-fluid">

                        <div class="collapse navbar-collapse" id="navbarNavF">

                                <li class="nav-item">
                                    <a href="./products.html" class="nav-link text-dark fw-bold">Productos</a>
                                </li>

                                </li>

                <a href="#" class="p-2"><img src="assets/Images/Facebook_Logo_Primary.png" alt="Logo Facebook" width="30" height="30"></a>
            </div>
        </div>
    
        <!-- Fila adicional: Copyright -->
        <div class="row mt-3">
            <div class="col-12 text-center">
                <span class="my-3 fw-semibold copy">Copyright &copy; Tienda de mascotas | Diseñado y desarrollado Luch@'s Company</span>
